<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>renderWechatFragment 渲染工作台</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #status { padding: 8px 12px; background: #f0f0f0; border-radius: 4px; margin-bottom: 12px; }
    #preview { border: 1px solid #ccc; padding: 15px; margin: 12px 0; max-width: 720px; }
    textarea { width: 100%; height: 240px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    h2 { font-size: 16px; }
  </style>
  <script src="./marked-lib.js"></script>
  <script type="importmap">
    { "imports": { "marked": "./marked-shim.js" } }
  </script>
</head>
<body>
  <div id="status">加载中…</div>
  <h2>渲染预览</h2>
  <div id="preview"></div>
  <h2>微信兼容 HTML 片段（可直接粘贴到公众号编辑器）</h2>
  <textarea id="fragment" readonly></textarea>

  <script type="module">
    const params = new URLSearchParams(location.search)
    const theme = params.get('theme') || 'ocean'
    const mdUrl = params.get('md') || 'input.md'
    const headerUrl = params.get('header') || ''
    const footerUrl = params.get('footer') || ''
    const saveUrl = params.get('save') || '/__save'

    try {
      const { renderWechatFragment } = await import('./src/render/index.js')

      const resp = await fetch(mdUrl)
      if (!resp.ok) throw new Error('读取 ' + mdUrl + ' 失败: ' + resp.status)
      const markdown = await resp.text()

      // 第一行为标题，其余为正文
      const lines = markdown.split('\n')
      const title = (lines[0] || '').trim().replace(/^#+\s*/, '')
      const body = lines.slice(1).join('\n').replace(/^\s*\n/, '')

      // 头部 / 底部模板（可空）
      let header = ''
      let footer = ''
      if (headerUrl) {
        const r = await fetch(headerUrl)
        if (r.ok) header = await r.text()
      }
      if (footerUrl) {
        const r = await fetch(footerUrl)
        if (r.ok) footer = await r.text()
      }

      let fragment = await renderWechatFragment({
        markdown: body,
        theme,
        header,
        footer,
        basePath: 'themes/'
      })

      // 后处理：把相对路径图片内联为 base64 data URI（微信编辑器粘贴时可识别并转存）
      const inlineDoc = new DOMParser().parseFromString(fragment, 'text/html')
      const imgs = Array.from(inlineDoc.querySelectorAll('img'))
      await Promise.all(imgs.map(async img => {
        const src = img.getAttribute('src') || ''
        if (!src || src.startsWith('data:')) return
        try {
          const r = await fetch(new URL(src, location.href))
          if (!r.ok) throw new Error('HTTP ' + r.status)
          const blob = await r.blob()
          const dataUrl = await new Promise((res, rej) => {
            const fr = new FileReader()
            fr.onload = () => res(fr.result)
            fr.onerror = rej
            fr.readAsDataURL(blob)
          })
          img.setAttribute('src', dataUrl)
        } catch (e) { console.warn('图片内联失败:', src, e.message) }
      }))
      fragment = inlineDoc.body.innerHTML

      window.__title = title
      window.__theme = theme
      window.__fragment = fragment

      // 自动保存到同源端点（供 CLI 提取，避免大字符串回传）
      try {
        const saveResp = await fetch(saveUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: JSON.stringify({ title, theme, fragment })
        })
        window.__saved = saveResp.ok
      } catch (e) {
        window.__saved = false
        console.warn('自动保存失败:', e.message)
      }

      document.getElementById('preview').innerHTML = fragment
      document.getElementById('fragment').value = fragment
      document.getElementById('status').textContent =
        '渲染完成 ✔ 标题: ' + title + ' | 主题: ' + theme +
        ' | 片段长度: ' + fragment.length + ' 字符 | 已保存: ' + (window.__saved ? '是' : '否')
    } catch (e) {
      document.getElementById('status').textContent = '渲染失败: ' + e.message
      window.__fragment = null
      console.error(e)
    }
  </script>
</body>
</html>
